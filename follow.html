<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Follow Us 🥰</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: skyblue;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      height: 100vh;
    }

    .follow-us {
      text-align: center;
      background: #fff;
      padding: 20px;
      border: 1px solid blue;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 100%;
      margin-bottom: 20px;
    }

    .follow-us h1 {
      font-size: 1.8em;
      color: #007BFF;
      margin-bottom: 30px;
    }

    .follow-us p {
      font-size: 1.2em;
      color: #000000;
      margin-bottom: 30px;
      text-decoration: underline;
    }

    .social-icons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
    }

    .social-icon {
      text-align: center;
    }

    .social-icon a {
      text-decoration: none;
      font-size: 2.5em;
      color: #000;
      transition: color 0.3s ease;
      margin-bottom: 20px;
    }

    .social-icon a:hover {
      color: #007BFF;
    }

    .social-icon a.facebook:hover {
      color: #4267B2;
    }

    .social-icon a.instagram:hover {
      color: #E1306C;
    }

    .social-icon a.tiktok:hover {
      color: #000;
    }

    .social-icon a.twitter:hover {
      color: #1DA1F2;
    }

    .social-icon a.youtube:hover {
      color: #FF0000;
    }

    .social-icon label {
      display: block;
      margin-top: 8px;
      font-size: 0.9em;
      color: #000000;
      margin-bottom: 20px;
    }

    .button {
      display: inline-block;
      padding: 10px 20px;
      font-size: 17px;
      color: white;
      background-color: dodgerblue;
      text-align: center;
      text-decoration: none;
      border-radius: 5px;
      border: 1px solid blue;
      cursor: pointer;
    }

    .button:hover {
      background-color: lime;
    }

    footer {
      margin-top: 20px;
      font-size: 1em;
      color: #000000;
    }
  </style>
</head>
<body>
  <div class="follow-us">
    <h1>Follow Us</h1>
    <p>Stay connected with us on our social media platforms! 🥰</p>
    <div class="social-icons">
      <div class="social-icon">
        <a href="https://www.facebook.com" target="_blank" class="facebook" aria-label="Facebook">
          <i class="fab fa-facebook-f"></i>
        </a>
        <label>MasubayCars@facebook.com</label>
      </div>
      <div class="social-icon">
        <a href="https://www.instagram.com" target="_blank" class="instagram" aria-label="Instagram">
          <i class="fab fa-instagram"></i>
        </a>
        <label>MasubayCars@instagram.com</label>
      </div>
      <div class="social-icon">
        <a href="https://www.tiktok.com" target="_blank" class="tiktok" aria-label="TikTok">
          <i class="fab fa-tiktok"></i>
        </a>
        <label>MasubayCars@tiktok.com</label>
      </div>
      <div class="social-icon">
        <a href="https://www.twitter.com" target="_blank" class="twitter" aria-label="Twitter">
          <i class="fab fa-twitter"></i>
        </a>
        <label>MasubayCars@twitter.com</label>
      </div>
      <div class="social-icon">
        <a href="https://www.youtube.com" target="_blank" class="youtube" aria-label="YouTube">
          <i class="fab fa-youtube"></i>
        </a>
        <label>Masubay Sports Car Dealership Channel</label>
      </div>
    </div>
    <footer>
      &copy; 2024 Masubay Sports Car Dealership. All Rights Reserved. | Follow us for updates and offers!
    </footer>
  </div>
  <a href="home.html" class="button">Return to Home</a>
</body>
</html>
