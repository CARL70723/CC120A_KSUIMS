<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: skyblue;
    }

    .gallery-section {
      padding: 20px;
      margin: 20px auto;
      max-width: 1200px;
    }

    .gallery-section h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
      font-size: 2.5em;
      text-decoration: underline;
    }

    .gallery-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .gallery-container img {
      width: 100%;
      height: 200px;
      object-fit: cover; 
      border-radius: 8px;
      
      transition: transform 0.3s ease;
    }

    .gallery-container img:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 10px lime;
    }

    .button {
      display: block;
      margin: 20px auto;
      padding: 10px 20px;
      font-size: 17px;
      color: white;
      background-color: dodgerblue;
      text-align: center;
      text-decoration: none;
      border-radius: 5px;
      border: 1px solid blue;
      cursor: pointer;
      width: 150px;
      text-align: center;
    }

    .button:hover {
      background-color: lime;
      color: black;
    }

    footer {
      text-align: center;
      margin-top: 20px;
      padding: 10px 0;
      background: #004085;
      color: white;
    }
  </style>
</head>
<body>
  <section class="gallery-section">
    <h2>Gallery</h2>
    <div class="gallery-container">
      <img src="bg1.jpg" alt="Image 1">
      <img src="bg2.jpg" alt="Image 2">
      <img src="bg3.jpg" alt="Image 3">
      <img src="bg4.jpg" alt="Image 4">
      <img src="bg5.jpg" alt="Image 5">
      <img src="bg6.jpg" alt="Image 6">
      <img src="bg7.jpg" alt="Image 7">
      <img src="bg8.jpg" alt="Image 8">
      <img src="bg9.jpg" alt="Image 9">
      <img src="bg10.jpg" alt="Image 10">
      <img src="bg11.jpg" alt="Image 11">
      <img src="bg12.jpg" alt="Image 12">
      <img src="bg13.jpg" alt="Image 13">
      <img src="bg14.jpg" alt="Image 14">
      <img src="bg15.jpg" alt="Image 15">
    </div>
  </section>

  <a href="home.html" class="button">Return to Home</a>

  <footer>
    &copy; 2024 Masubay Car Parts Shop. All Rights Reserved.
  </footer>
</body>
</html>
